<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trend Me Collections</title><link rel="icon" href="logo.jpg">
<style>
:root{--bg:#fbf6ea;--card:#fff;--tx:#1b1608;--mut:#7a6d4d;--gold:#a87908;--g2:#e6b93c;--bd:#eadfc2}
[data-theme=dark]{--bg:#0a0a0a;--card:#16130a;--tx:#f6ecd0;--mut:#b9a877;--gold:#e6b93c;--g2:#ffd966;--bd:#3a2f10}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:var(--tx);background:radial-gradient(circle at 15% 0,#e6b93c26,transparent 40%),radial-gradient(circle at 90% 30%,#e6b93c1a,transparent 40%),var(--bg);min-height:100vh}
header{position:sticky;top:0;z-index:9;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--bd)}
header img{height:46px;border-radius:50%}.brand{color:var(--gold);font-size:1.2rem}.brand small{display:block;font-size:.65rem;letter-spacing:3px}
#q{flex:1;min-width:80px}main{max-width:1400px;margin:auto;padding:14px}
input,select,textarea,button{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer}.btn{background:linear-gradient(135deg,var(--g2),var(--gold));color:#1b1608;border:0;font-weight:700}
.hero{text-align:center;padding:22px;border:1px solid var(--bd);border-radius:16px;background:var(--card);margin-bottom:12px}.hero h1{margin:0;color:var(--gold)}
.cats{display:flex;gap:12px;overflow-x:auto;padding:8px 0}.cat{flex:none;text-align:center;font-size:.75rem;width:74px;cursor:pointer}.cat span{display:grid;place-items:center;width:58px;height:58px;margin:auto;font-size:1.6rem;border-radius:50%;border:2px solid var(--bd);background:var(--card)}.cat.on span{border-color:var(--g2)}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tabs button.on{background:var(--gold);color:#1b1608}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;position:relative}.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#0002}
.price{color:var(--gold);font-weight:700}.badge{font-size:.7rem;padding:2px 8px;border-radius:9px;background:#2a8a3a;color:#fff}.badge.no{background:#b3261e}.heart{position:absolute;right:14px;top:14px;border-radius:50%;padding:4px 8px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}.row>*{flex:1;min-width:120px}
.steps{display:flex;flex-direction:column;gap:6px}.st{padding:8px 12px;border-left:4px solid var(--bd);color:var(--mut)}.st.done{border-color:var(--g2);color:var(--tx)}
.msgs{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.m{padding:7px 11px;border-radius:12px;max-width:80%;background:var(--bd)}.m.me{align-self:flex-end;background:var(--gold);color:#1b1608}
#modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20}#modal .panel{width:min(380px,92vw)}small{color:var(--mut)}
</style></head><body>
<header><img src="logo.jpg" alt="" onerror="this.style.display='none'"><b class="brand">Trend Me<small>COLLECTIONS</small></b><input id="q" placeholder="Search clothes…" oninput="draw()"><button onclick="go('cart')">🛒<span id="cc"></span></button><button onclick="go('track')" title="Track order">📦</button><button onclick="go('chat')" title="Chat">💬</button><button id="adm" hidden onclick="go('admin')">⚙️</button><button onclick="theme()" title="Day/Night">🌓</button><button id="acc" onclick="acct()">Login</button></header>
<main id="app"></main><div id="modal"></div>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== CONFIG: fill these 4 =====
const SB_URL='YOUR_SUPABASE_URL',SB_KEY='YOUR_SUPABASE_ANON_KEY',PAYSTACK_KEY='pk_test_xxxxxxxx',OPAY='Opay 0000000000 - Trend Me Collections',WA='2340000000000';
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS=[['👕','Round necks'],['👔','Shirts'],['👖','Trousers'],['🎞️','Vintage'],['🩱','Skirts'],['👗','Gowns'],['🎽','Crop tops'],['🩳','Palazzos'],['🥻','Kimono'],['💃','Minis'],['🧒','Children'],['👠','Shoes'],['👜','Bags'],['💍','Accessories']];
const STEPS=['Order placed','Payment confirmed','Processing','Packed','Shipped','Out for delivery','Delivered'];
const $=id=>document.getElementById(id),v=id=>$(id).value,money=n=>'₦'+Number(n).toLocaleString(),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let reviews=[],zones=[],zone='',user,profile,products=[],cart=JSON.parse(localStorage.cart||'[]'),tab='popular',cat='',view='shop',favs=JSON.parse(localStorage.favs||'[]'),atab='products';
const save=()=>{localStorage.cart=JSON.stringify(cart);$('cc').textContent=cart.length?' '+cart.reduce((a,c)=>a+c.qty,0):''};
function theme(){const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark';localStorage.th=d.dataset.theme}
if(localStorage.th)document.documentElement.dataset.theme=localStorage.th;
async function setUser(s){user=s?.user;profile=user?(await sb.from('profiles').select('*').eq('id',user.id).single()).data:null;$('acc').textContent=user?'Logout':'Login';$('adm').hidden=!profile?.is_admin}
async function init(){const{data}=await sb.auth.getSession();await setUser(data.session);sb.auth.onAuthStateChange((e,s)=>{setUser(s);if(e=='PASSWORD_RECOVERY'){const p=prompt('Enter your new password (min 6 characters)');if(p)sb.auth.updateUser({password:p}).then(r=>alert(r.error?r.error.message:'Password updated'))}});
sb.channel('m').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>{if(view=='chat')chat();if(view=='admin'&&atab=='chat')achat()}).subscribe();
await load();save();go('shop')}
async function load(){products=(await sb.from('products').select('*').order('created_at',{ascending:false})).data||[];reviews=(await sb.from('reviews').select('*').order('id',{ascending:false})).data||[];zones=(await sb.from('delivery_zones').select('*').order('name')).data||[]}
function go(x){if((x=='chat'||x=='admin')&&!user)return acct();view=x;scrollTo(0,0);({shop,cart:cartV,track,chat,admin})[x]()}
// ===== SHOP =====
function shop(){$('app').innerHTML=`<div class="hero"><h1>Trend Me Collections</h1><small>…Dress Smart, Live Trendy ♡</small><br><button onclick="sizeGuide()">📏 Size guide</button></div><div class="cats">${CATS.map(c=>`<div class="cat ${cat==c[1]?'on':''}" onclick="cat=cat=='${c[1]}'?'':'${c[1]}';shop()"><span>${c[0]}</span>${c[1]}</div>`).join('')}</div><div class="tabs">${[['popular','🔥 Popular'],['favorite','❤️ Favorite'],['new','✨ New in stock'],['ordered','🛍️ Most ordered']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';shop()">${t[1]}</button>`).join('')}</div><div id="g" class="grid"></div>`;draw()}
function draw(){const g=$('g');if(!g)return;const s=v('q').toLowerCase();let l=products.filter(p=>(!cat||p.category==cat)&&(!s||(p.name+p.category).toLowerCase().includes(s)));
const k={popular:p=>p.views,favorite:p=>p.favs+(favs.includes(p.id)?1e6:0),new:p=>+new Date(p.created_at)+(p.is_new?1e13:0),ordered:p=>p.ordered}[tab];l=l.sort((a,b)=>k(b)-k(a));
g.innerHTML=l.map(p=>{const out=p.stock<1;return`<div class="card"><button class="heart" onclick="fav(${p.id})">${favs.includes(p.id)?'❤️':'🤍'}</button><img src="${esc(p.image_url)}" alt="" loading="lazy" onclick="sb.rpc('bump',{p_id:${p.id},p_col:'views'})"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><small>${esc(p.category)} · ${p.stock} left</small> <a href="#" onclick="rev(${p.id});return false">${stars(p.id)}</a> <span class="badge ${out?'no':''}">${out?'Out of stock':'In stock'}</span><div class="row"><select id="s${p.id}">${(p.sizes||[]).map(z=>`<option>${esc(z)}</option>`).join('')}</select><button class="btn" ${out?'disabled':''} onclick="add(${p.id})">Add to cart</button></div></div>`}).join('')||'<p>No products found.</p>'}
function fav(id){if(favs.includes(id))favs=favs.filter(x=>x!=id);else{favs.push(id);sb.rpc('bump',{p_id:id,p_col:'favs'})}localStorage.favs=JSON.stringify(favs);draw()}
function add(id){const p=products.find(x=>x.id==id),size=$('s'+id)?.value||'',c=cart.find(x=>x.id==id&&x.size==size);if(c){if(c.qty<p.stock)c.qty++}else cart.push({id,size,qty:1});save();$('cc').animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],300)}
const wa=(n,t)=>'https://wa.me/'+String(n).replace(/\D/g,'').replace(/^0/,'234')+'?text='+encodeURIComponent(t);
const closeM=`<button onclick="$('modal').style.display='none'">Close</button>`;
function stars(id){const r=reviews.filter(x=>x.product_id==id);return r.length?'⭐'+(r.reduce((a,x)=>a+x.rating,0)/r.length).toFixed(1)+' ('+r.length+')':'☆ Review'}
function rev(id){const p=products.find(x=>x.id==id),m=$('modal');m.style.display='grid';m.innerHTML=`<div class="panel" style="max-height:90vh;overflow:auto"><h3>${esc(p.name)} reviews</h3>${reviews.filter(x=>x.product_id==id).map(x=>`<p>${'⭐'.repeat(x.rating)} <b>${esc(x.name)}</b><br>${esc(x.body)}</p>`).join('')||'<small>No reviews yet.</small>'}${user?`<div class="row"><select id="rr">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div><textarea id="rb" placeholder="Your review" style="width:100%"></textarea><button class="btn" onclick="addrev(${id})">Submit</button> `:'<small>Login to write a review.</small> '}${closeM}</div>`}
async function addrev(id){const r=await sb.from('reviews').insert({product_id:id,user_id:user.id,name:profile?.full_name||'Customer',rating:+v('rr'),body:v('rb')});if(r.error)return alert(r.error.message);await load();$('modal').style.display='none';draw()}
function sizeGuide(){const m=$('modal');m.style.display='grid';m.innerHTML=`<div class="panel" style="max-height:90vh;overflow:auto"><h3>📏 Size guide (inches)</h3><b>Women</b><br><small>S / UK 8: bust 33-34, waist 26-27<br>M / UK 10-12: bust 35-36, waist 28-29<br>L / UK 14: bust 37-39, waist 30-32<br>XL / UK 16: bust 40-42, waist 33-35</small><br><br><b>Men</b><br><small>S: chest 34-36, waist 28-30<br>M: chest 38-40, waist 31-33<br>L: chest 42-44, waist 34-36<br>XL: chest 46-48, waist 37-39</small><br><br><b>Shoes (EU)</b><br><small>36 = 22.9cm · 38 = 24.1cm · 40 = 25.4cm · 42 = 26.7cm · 44 = 27.9cm</small><br><br><small>Measure over light clothing. Between sizes? Choose the bigger one.</small><br>${closeM}</div>`}
// ===== CART =====
function calc(){const sub=cart.reduce((a,c)=>a+products.find(p=>p.id==c.id).price*c.qty,0);const ok=profile?.coupon_approved&&!profile.coupon_used;const d=ok?(sub>=20000?1000:sub>=10000?500:0):0;return{sub,disc:d,fee:zones.find(z=>z.name==zone)?.fee||0}}
function totHTML(){const t=calc();return`Subtotal: ${money(t.sub)}<br>Coupon: -${money(t.disc)}<br>Delivery: ${zone?money(t.fee):'choose location below'}<br><b class="price">Total: ${money(t.sub-t.disc+t.fee)}</b>`}
function zonePick(z){zone=z;$('tot').innerHTML=totHTML()}
function cartV(){cart=cart.filter(c=>products.find(p=>p.id==c.id));const t=calc();$('app').innerHTML=`<div class="panel"><h2>Your cart</h2>${cart.map((c,i)=>{const p=products.find(x=>x.id==c.id);return`<div class="row"><b>${esc(p.name)} (${esc(c.size)})</b><span>${money(p.price)}</span><span><button onclick="qty(${i},-1)">−</button> ${c.qty} <button onclick="qty(${i},1)">+</button></span><button onclick="cart.splice(${i},1);save();cartV()">✕</button></div>`}).join('')||'<p>Cart is empty.</p>'}<p id="tot">${totHTML()}</p>${profile&&!profile.coupon_approved?'<small>🎁 Your welcome coupon activates once admin approves your account.</small>':''}</div>
<div class="panel"><h3>Delivery & payment</h3><div class="row"><input id="n" placeholder="Full name" value="${esc(profile?.full_name)}"><input id="e" type="email" placeholder="Email (for order details)" value="${esc(user?.email)}"><input id="ph" placeholder="Phone" value="${esc(profile?.phone)}"></div><select style="width:100%;margin-bottom:6px" onchange="zonePick(this.value)"><option value="">Delivery location…</option>${zones.map(z=>`<option value="${esc(z.name)}" ${z.name==zone?'selected':''}>${esc(z.name)} - ${money(z.fee)}</option>`).join('')}</select><textarea id="ad" placeholder="Full delivery address" style="width:100%"></textarea><textarea id="cm" placeholder="Other comments" style="width:100%;margin-top:6px"></textarea><div class="row"><select id="pm"><option value="paystack">Pay with Paystack (card/transfer/USSD)</option><option value="opay">Pay with Opay (transfer)</option></select><button class="btn" onclick="order()">Place order</button></div>${user?'':'<small>Guest checkout is on. Login to get coupons and chat with sales.</small>'}</div>`}
function qty(i,d){const p=products.find(x=>x.id==cart[i].id);cart[i].qty=Math.max(1,Math.min(p.stock,cart[i].qty+d));save();cartV()}
async function order(){if(!cart.length)return alert('Cart is empty');if(!v('n')||!v('e')||!v('ad'))return alert('Name, email and address are required');if(!zone)return alert('Please choose your delivery location');
const{data,error}=await sb.rpc('place_order',{p_items:cart,p_name:v('n'),p_email:v('e'),p_phone:v('ph'),p_address:v('ad'),p_comment:v('cm'),p_method:v('pm'),p_zone:zone});if(error)return alert(error.message);
cart=[];save();await load();const em=v('e'),nm=v('n'),ph0=v('ph');const done=()=>{if(confirm('Send your order details to Trend Me on WhatsApp for faster processing?'))open(wa(WA,'Hello Trend Me, new order '+data.tid+' ('+money(data.total)+') from '+nm+'. Phone: '+ph0));go('track');$('t').value=data.tid;$('te').value=em;trk()};
if(v('pm')=='paystack'&&window.PaystackPop)PaystackPop.setup({key:PAYSTACK_KEY,email:$('e')?.value||'',amount:data.total*100,currency:'NGN',ref:data.tid,callback:()=>{alert('Payment received. Admin will confirm shortly.');done()},onClose:()=>{alert('Order saved. Tracking ID: '+data.tid+'. Pay later via Track page.');done()}}).openIframe();
else{alert(`Order ${data.tid} placed.\nTransfer ${money(data.total)} to:\n${OPAY}\nUse ${data.tid} as narration, then send receipt in Chat.`);done()}}
// ===== TRACK =====
function track(){$('app').innerHTML=`<div class="panel"><h2>Track order</h2><div class="row"><input id="t" placeholder="Tracking ID e.g. TM-261112-AB12C"><input id="te" placeholder="Email used on order" value="${esc(user?.email)}"><button class="btn" onclick="trk()">Track</button></div><div id="tr"></div></div><div id="mine"></div>`;if(user)sb.from('orders').select('*').order('id',{ascending:false}).then(r=>{$('mine').innerHTML=`<div class="panel"><h3>My orders</h3>${(r.data||[]).map(o=>`<div class="row"><b>${o.tracking_id}</b><span>${money(o.total)}</span><span>${o.status}</span></div>`).join('')}</div>`})}
async function trk(){const{data}=await sb.rpc('track_order',{p_tid:v('t'),p_email:v('te')});const o=data?.[0];$('tr').innerHTML=o?`<p><b>${o.tracking_id}</b> · ${money(o.total)} · ${o.paid?'Paid ✅':'Awaiting payment confirmation'}</p><div class="steps">${STEPS.map((s,i)=>`<div class="st ${i<=STEPS.indexOf(o.status)?'done':''}">${i<=STEPS.indexOf(o.status)?'✔':'○'} ${s}</div>`).join('')}</div>`:'<p>No order found. Check ID and email.</p>'}
// ===== CHAT =====
async function chat(){const m=(await sb.from('messages').select('*').eq('user_id',user.id).order('id')).data||[];$('app').innerHTML=`<div class="panel"><h2>Chat with Sales</h2><div class="msgs" id="ms">${m.map(x=>`<div class="m ${x.from_admin?'':'me'}">${esc(x.body)}</div>`).join('')||'<small>Say hi and quote your tracking ID.</small>'}</div><div class="row"><input id="cb" placeholder="Type message…" onkeydown="event.key=='Enter'&&send()"><button class="btn" onclick="send()">Send</button></div></div>`;$('ms').scrollTop=1e9}
async function send(){if(!v('cb'))return;await sb.from('messages').insert({user_id:user.id,body:v('cb')});$('cb').value=''}
// ===== AUTH =====
function acct(){if(user){sb.auth.signOut();profile=null;return go('shop')}const m=$('modal');m.style.display='grid';m.innerHTML=`<div class="panel"><h3>Welcome 👑</h3><div class="row"><input id="an" placeholder="Full name (signup only)"><input id="ap" placeholder="Phone (signup only)"></div><div class="row"><input id="ae" type="email" placeholder="Email"><input id="aw" type="password" placeholder="Password"></div><div class="row"><button class="btn" onclick="auth('in')">Login</button><button class="btn" onclick="auth('up')">Sign up</button></div><a href="#" onclick="forgot();return false">Forgot password?</a> · <a href="#" onclick="$('modal').style.display='none';return false">Close</a></div>`}
async function auth(t){const r=t=='in'?await sb.auth.signInWithPassword({email:v('ae'),password:v('aw')}):await sb.auth.signUp({email:v('ae'),password:v('aw'),options:{data:{full_name:v('an'),phone:v('ap')}}});if(r.error)return alert(r.error.message);if(t=='up'&&!r.data.session)alert('Check your email to confirm your account.');$('modal').style.display='none'}
async function forgot(){if(!v('ae'))return alert('Enter your email first');const r=await sb.auth.resetPasswordForEmail(v('ae'),{redirectTo:location.href.split('#')[0]});alert(r.error?r.error.message:'Reset link sent to your email')}
// ===== ADMIN =====
function admin(){if(!profile?.is_admin)return go('shop');$('app').innerHTML=`<div class="tabs">${['products','orders','chat','customers','delivery','reports'].map(t=>`<button class="${atab==t?'on':''}" onclick="atab='${t}';admin()">${t}</button>`).join('')}</div><div id="ad_"></div>`;({products:aprod,orders:aord,chat:achat,customers:acust,delivery:adel,reports:arep})[atab]()}
function aprod(){$('ad_').innerHTML=`<div class="panel"><h3 id="pt">Add product</h3><input type="hidden" id="pid"><div class="row"><input id="pn" placeholder="Name"><select id="pc">${CATS.map(c=>`<option>${c[1]}</option>`).join('')}</select><input id="pp" type="number" placeholder="Price ₦"><input id="ps" type="number" placeholder="Stock"></div><div class="row"><input id="pz" placeholder="Sizes e.g. S,M,L,XL or 38,40,42"><input id="pi" type="file" accept="image/*"><label><input id="pw" type="checkbox" checked> New</label><label><input id="pa" type="checkbox" checked> Available</label></div><textarea id="pd" placeholder="Description" style="width:100%"></textarea><button class="btn" onclick="sp()">Save product</button></div><div class="grid">${products.map(p=>`<div class="card"><img src="${esc(p.image_url)}"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><small>Stock ${p.stock} · ${p.active?'Live':'Hidden'}</small><div class="row"><button onclick="ep(${p.id})">Edit</button><button onclick="dp(${p.id})">Delete</button></div></div>`).join('')}</div>`}
function ep(id){const p=products.find(x=>x.id==id);scrollTo(0,0);$('pt').textContent='Edit product';pid.value=id;pn.value=p.name;pc.value=p.category;pp.value=p.price;ps.value=p.stock;pz.value=(p.sizes||[]).join(',');pd.value=p.description||'';pw.checked=p.is_new;pa.checked=p.active}
async function sp(){let url=null;const f=$('pi').files[0];if(f){const path=Date.now()+'-'+f.name.replace(/\W/g,'_');const u=await sb.storage.from('products').upload(path,f);if(u.error)return alert(u.error.message);url=sb.storage.from('products').getPublicUrl(path).data.publicUrl}
const d={name:v('pn'),category:v('pc'),price:+v('pp'),stock:+v('ps'),sizes:v('pz').split(',').map(s=>s.trim()).filter(Boolean),description:v('pd'),is_new:pw.checked,active:pa.checked};if(url)d.image_url=url;
const r=v('pid')?await sb.from('products').update(d).eq('id',v('pid')):await sb.from('products').insert(d);if(r.error)return alert(r.error.message);await load();aprod()}
async function dp(id){if(confirm('Delete product?')){await sb.from('products').delete().eq('id',id);await load();aprod()}}
async function aord(){const o=(await sb.from('orders').select('*').order('id',{ascending:false})).data||[];$('ad_').innerHTML=o.map(x=>`<div class="panel"><b>${x.tracking_id}</b> · ${money(x.total)} (−${money(x.discount)}) · ${x.method} · ${x.paid?'Paid ✅':'Unpaid'}<br><small>${esc(x.name)} · ${esc(x.phone)} · ${esc(x.email)}<br>${esc(x.address)} (${esc(x.zone)}, delivery ${money(x.delivery_fee||0)})<br>${esc(x.comment)}<br>${x.items.map(i=>`${esc(i.name)} (${esc(i.size)}) ×${i.qty}`).join(', ')}</small><div class="row"><select onchange="ost('${x.id}',this.value)">${STEPS.map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="pay('${x.id}')">Confirm payment</button><a href="${wa(x.phone,'Hello '+x.name+', your Trend Me order '+x.tracking_id+' status: '+x.status)}" target="_blank"><button>WhatsApp customer</button></a></div></div>`).join('')||'No orders yet.'}
const ost=async(id,s)=>{await sb.from('orders').update({status:s}).eq('id',id);aord()};const pay=async id=>{await sb.from('orders').update({paid:true,status:'Payment confirmed'}).eq('id',id);aord()};
let cu;async function achat(){const c=(await sb.from('profiles').select('id,full_name').eq('is_admin',false)).data||[];cu=cu||c[0]?.id;const m=cu?(await sb.from('messages').select('*').eq('user_id',cu).order('id')).data:[];$('ad_').innerHTML=`<div class="panel"><select onchange="cu=this.value;achat()">${c.map(x=>`<option value="${x.id}" ${x.id==cu?'selected':''}>${esc(x.full_name)}</option>`).join('')}</select><div class="msgs">${m.map(x=>`<div class="m ${x.from_admin?'me':''}">${esc(x.body)}</div>`).join('')}</div><div class="row"><input id="cb"><button class="btn" onclick="asend()">Reply</button></div></div>`}
async function asend(){if(v('cb')&&cu){await sb.from('messages').insert({user_id:cu,from_admin:true,body:v('cb')})}}
async function acust(){const c=(await sb.from('profiles').select('*').eq('is_admin',false)).data||[];$('ad_').innerHTML=c.map(x=>`<div class="panel row"><b>${esc(x.full_name)}</b><span>${esc(x.phone)}</span><span>${x.coupon_approved?(x.coupon_used?'Coupon used':'Coupon active'):'Pending'}</span>${x.coupon_approved?'':`<button class="btn" onclick="appr('${x.id}')">Approve + give coupon</button>`}</div>`).join('')}
const appr=async id=>{await sb.from('profiles').update({coupon_approved:true}).eq('id',id);acust()};
async function adel(){$('ad_').innerHTML=`<div class="panel"><h3>Delivery zones</h3>${zones.map(z=>`<div class="row"><b>${esc(z.name)}</b><input type="number" value="${z.fee}" onchange="sb.from('delivery_zones').update({fee:+this.value}).eq('id',${z.id}).then(load)"><button onclick="dz(${z.id})">Delete</button></div>`).join('')}<div class="row"><input id="zn2" placeholder="Location e.g. Ikeja"><input id="zf" type="number" placeholder="Fee ₦"><button class="btn" onclick="az()">Add</button></div></div>`}
async function az(){const r=await sb.from('delivery_zones').insert({name:v('zn2'),fee:+v('zf')});if(r.error)return alert(r.error.message);await load();adel()}
async function dz(id){await sb.from('delivery_zones').delete().eq('id',id);await load();adel()}
async function arep(){const o=(await sb.from('orders').select('*')).data||[],paid=o.filter(x=>x.paid),sum=a=>a.reduce((t,x)=>t+x.total,0),day=new Date().toISOString().slice(0,10),mon=day.slice(0,7),top={},st={};paid.forEach(x=>x.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));o.forEach(x=>st[x.status]=(st[x.status]||0)+1);
$('ad_').innerHTML=`<div class="panel"><h3>Sales report</h3><p>All orders: <b>${o.length}</b> · Paid: <b>${paid.length}</b><br>Revenue (paid, incl. delivery): <b class="price">${money(sum(paid))}</b><br>Today: ${money(sum(paid.filter(x=>x.created_at.startsWith(day))))}<br>This month: ${money(sum(paid.filter(x=>x.created_at.startsWith(mon))))}<br>Delivery fees included: ${money(paid.reduce((t,x)=>t+(x.delivery_fee||0),0))}</p><h4>Top sellers</h4>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(t=>`<div>${esc(t[0])} - ${t[1]} sold</div>`).join('')||'<small>No paid sales yet</small>'}<h4>Orders by status</h4>${Object.entries(st).map(t=>`<div>${t[0]}: ${t[1]}</div>`).join('')}</div>`}
init();
</script></body></html>
